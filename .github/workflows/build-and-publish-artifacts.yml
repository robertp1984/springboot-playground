name: Build and Upload Artifacts

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-upload-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven
          architecture: x64
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
      
      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta-note
        uses: docker/metadata-action@v6.2.0
        with:
          images: robertp22/springboot-note
      - name: Build and push Docker image
        id: push-note
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./springboot-note
          file: ./springboot-note/Dockerfile
          push: true
          tags: ${{ steps.meta-note.outputs.tags }}
          labels: ${{ steps.meta-note.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/robertp22/springboot-note
          subject-digest: ${{ steps.push-note.outputs.digest }}
          push-to-registry: true

