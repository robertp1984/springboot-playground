spring.application.name=SpringBootNoteCategorizer

server.port=8085

management.endpoints.web.exposure.include=health, info, metrics, beans, env
management.endpoint.health.show-details=always
info.java.enabled=true
info.java.env.enabled=true


info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@


spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.4-mini

app.kafka.bootstrap-servers=localhost:29092
app.kafka.input-topic=playground.stickynote.json
app.kafka.output-topic=playground.stickynote.json.categorized

app.categorizer.engine=OPENAI
